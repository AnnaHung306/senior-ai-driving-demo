name: Static demo checks

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check_static_demo.py', 'web/static-demo-tests/**', '.github/workflows/static-demo-check.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check_static_demo.py', 'web/static-demo-tests/**', '.github/workflows/static-demo-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every static asset and recorded frame
        run: python3 scripts/check_static_demo.py
      - name: Check replay source and error handling
        run: node --test web/static-demo-tests/replay.test.mjs
